# Release tier: on a `v*` tag, build the native CLI `schemify-interop` for Linux, macOS (Apple
# silicon and Intel), Windows and WASI, plus the guest module, and attach them to a *draft*
# GitHub release: a maintainer checks it, then publishes. A push to `ci/release*` runs the same
# builds as a dry run and publishes nothing.
name: release

on:
  push:
    tags: ["v*"]
    branches: ["ci/release*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0" # = ci.yml
  # Shipped binaries: no debug info, LTO, no unwinding (as Schemify's own release).
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_STRIP: symbols
  CARGO_PROFILE_RELEASE_LTO: fat
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
  CARGO_PROFILE_RELEASE_PANIC: abort

jobs:
  # macOS x86_64 is cross-compiled on the Apple-silicon runner: GitHub retired its Intel
  # macOS images, and Apple's SDK builds both architectures.
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos-aarch64, exe: "", target: "" }
          - { os: macos-latest, name: macos-x86_64, exe: "", target: x86_64-apple-darwin }
          - { os: windows-latest, name: windows-x86_64, exe: ".exe", target: "" }
          - { os: ubuntu-latest, name: wasi, exe: ".wasm", target: wasm32-wasip1 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: build
        run: |
          target="${{ matrix.target && format('--target {0}', matrix.target) || '' }}"
          cargo build --release --locked $target --features cli --bin schemify-interop
      - name: package
        run: |
          bin="target/${{ matrix.target }}/release"
          if [ "${{ matrix.target }}" = x86_64-apple-darwin ]; then
            file "$bin/schemify-interop" | tee /dev/stderr | grep -q x86_64
          fi
          dir="schemify-interop-${GITHUB_REF_NAME//\//-}-${{ matrix.name }}"
          mkdir "$dir"
          cp "$bin/schemify-interop${{ matrix.exe }}" README.md LICENSE "$dir"/
          if [ "${{ runner.os }}" = Windows ]; then
            7z a -bd "$dir.zip" "$dir" >/dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: schemify-interop-*-${{ matrix.name }}.*

  # Linux binaries link the build system's glibc symbol versions, so they are built in the
  # manylinux_2_28 image (AlmaLinux 8, glibc 2.28): they run on any distribution with glibc
  # ≥ 2.28, not only on the runner's.
  linux:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      GLIBC_MAX: "2.28"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo build --release --locked --features cli --bin schemify-interop
      - name: glibc floor (no symbol newer than GLIBC_${{ env.GLIBC_MAX }})
        run: |
          command -v objdump >/dev/null || dnf install -y -q binutils
          newest="$(objdump -T target/release/schemify-interop | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n 1)"
          echo "schemify-interop needs glibc $newest"
          [ "$(printf '%s\n%s\n' "$newest" "$GLIBC_MAX" | sort -V | tail -n 1)" = "$GLIBC_MAX" ] \
            || { echo "::error::schemify-interop needs glibc $newest > $GLIBC_MAX"; exit 1; }
      - name: package
        run: |
          dir="schemify-interop-${GITHUB_REF_NAME//\//-}-linux-x86_64"
          mkdir "$dir"
          cp target/release/schemify-interop README.md LICENSE "$dir"/
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: schemify-interop-*-linux-x86_64.tar.gz

  # The committed guest, as built by build.sh (CI's `guest` job proves it equals the rebuild).
  guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-artifact@v4
        with:
          name: release-guest
          path: interop.wasm

  publish:
    needs: [native, linux, guest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "schemify-interop $GITHUB_REF_NAME" --generate-notes
