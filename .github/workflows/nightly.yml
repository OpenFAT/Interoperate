# Nightly tier: the xschem import over the full corpus, fuzzing, and the suite against
# Schemify's public SDK `main` (SDK drift shows up within a day). The netlist differential and
# the export round trip need a netlister and spicecmp, which Schemify's public interface
# does not have (README "Development").
name: nightly

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      fuzz_minutes:
        description: minutes per fuzz target
        default: "60"
      only:
        description: >-
          run one job only (corpus, fuzz, schemify-main, or the manual fuzz-corpus);
          empty runs the nightly set
        default: ""

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0" # = ci.yml

jobs:
  # Goldens from a pinned xschem (nix), then every bench imported and checked
  # (`check_output`, NETLIST=none: Schemify's shipped command line has no netlister).
  corpus:
    if: ${{ !inputs.only || inputs.only == 'corpus' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CACHE: ${{ github.workspace }}/corpus/.cache
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: fetch corpus (pinned, sparse)
        run: corpus/fetch.sh
      - name: golden netlists from pinned xschem (nix)
        run: corpus/golden.sh
      - name: goldens report
        if: always()
        run: cat corpus/.cache/golden/REPORT.txt
      - name: import every bench (corpus/import_all.sh)
        run: NETLIST=none corpus/import_all.sh "$RUNNER_TEMP/rt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-results
          path: |
            corpus/.cache/golden/REPORT.txt
            ${{ runner.temp }}/rt/benches.map
          if-no-files-found: ignore

  # cargo-fuzz on both harnesses, starting from the checked-in corpus. The corpus carries over
  # between nights through the actions cache and is uploaded with any crash inputs; a crash
  # fails the job and its input becomes a checked-in regression test (tests/fuzz_corpus.rs).
  fuzz:
    if: ${{ !inputs.only || inputs.only == 'fuzz' }}
    strategy:
      fail-fast: false
      matrix:
        target: [xschem_read, sfyx_import]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MINUTES: ${{ inputs.fuzz_minutes || '60' }}
      CORPUS: fuzz/corpus/${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: actions/cache@v4
        with:
          path: ${{ env.CORPUS }}
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.target }}-
      # xschem_read also gets the fetched PDK files (seeded with real PDK files).
      - name: seeds
        run: fuzz/seeds.sh ${{ matrix.target }} "$CORPUS" --fetched
      - name: fuzz ${{ matrix.target }} for ${{ env.MINUTES }} min
        working-directory: fuzz
        run: >-
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} --
          -max_total_time=$((MINUTES * 60)) -rss_limit_mb=4096 -timeout=30 -print_final_stats=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            ${{ env.CORPUS }}
            fuzz/artifacts
          if-no-files-found: ignore

  # Manual only (`gh workflow run nightly.yml -f only=fuzz-corpus`): the minimized corpora to
  # check in for the merge-tier replay (tests/fuzz_corpus.rs). Commits nothing: download the
  # `fuzz-corpus-<target>` artifacts and commit them as fuzz/corpus/<target>/. Seeds are the
  # checked-in corpus and this repository's own files only (no fetched xschem or PDK files), so
  # every committed input derives from nothing third-party.
  fuzz-corpus:
    if: ${{ inputs.only == 'fuzz-corpus' }}
    strategy:
      fail-fast: false
      matrix:
        target: [xschem_read, sfyx_import]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MINUTES: ${{ inputs.fuzz_minutes || '60' }}
      CORPUS: fuzz/corpus/${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: seeds (this repository only)
        run: fuzz/seeds.sh ${{ matrix.target }} "$CORPUS"
      # Inputs up to 4 KiB: a corpus of small inputs replays fast in debug builds.
      - name: fuzz ${{ matrix.target }} for ${{ env.MINUTES }} min
        working-directory: fuzz
        run: >-
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} --
          -max_total_time=$((MINUTES * 60)) -max_len=4096 -rss_limit_mb=4096 -timeout=30
          -print_final_stats=1
      - name: minimize (cargo fuzz cmin)
        working-directory: fuzz
        run: |
          cargo fuzz cmin --target x86_64-unknown-linux-gnu ${{ matrix.target }}
          echo "$(ls "corpus/${{ matrix.target }}" | wc -l) inputs, $(du -sh "corpus/${{ matrix.target }}" | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: ${{ env.CORPUS }}
          if-no-files-found: error

  # The suite and the guest against the public SDK's `main` instead of the pinned rev: a red
  # run means the SDK moved under the plugin; bump the rev in Cargo.toml once it is fixed.
  schemify-main:
    if: ${{ !inputs.only || inputs.only == 'schemify-main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: point the Schemify SDK crates at main
        run: |
          sed -i 's|rev = "[0-9a-f]*"|branch = "main"|' Cargo.toml
          nix develop -c cargo update $(grep -o '^schemify-[a-z]*' Cargo.toml | sed 's/^/-p /')
          git diff --stat
      # First, so tests/guest.rs drives the guest built against main.
      - name: guest builds within its limit
        run: nix develop -c ./build.sh
      - run: nix develop -c cargo clippy --all-targets --features cli -- -D warnings
      - run: nix develop -c env SCHEMIFY_REQUIRE_XSCHEM=1 cargo test --features cli --no-fail-fast
