[package]
name = "interop"
description = "Interop plugin (D24 as amended 2026-10-12): xschem import today; Virtuoso import/export and xschem export to come. Never linked into the core."
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
publish = false
repository = "https://github.com/OpenFAT/Interoperate"

# cdylib: the wasm32 guest. rlib: the same importer as a plain library, for the native CLI
# (`schemify-interop`) and the oracle tests (tests/).
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The native command line (`src/cli/`, `schemify-interop`): file system access, so never
# part of the wasm guest. SpiceRack reads the PDK model files `pdk-scan` serves.
cli = ["dep:spicerack"]
# Schemify's `cadence-records` format additions (bench `test` and `param` records): a multi-test
# Maestro view and device parameters import and export as records. Needs a `schemify-format`
# that has them, which the public SDK does not yet: build with a local `[patch]` of it.
cadence-records = []

[[bin]]
name = "schemify-interop"
path = "src/bin/schemify-interop.rs"
required-features = ["cli"]

[dependencies]
# Schemify's public SDK only: the file format and the plugin ABI (its guest SDK).
schemify-abi.workspace = true
schemify-format.workspace = true
# Bit-identical transcendentals on every target for `expr` (D32).
libm = "0.2"
# SpiceRack's IR, readers and writers (no simulator backends): the PDK store and model
# conversion (CLI only). Pinned like the Schemify crates.
spicerack = { git = "https://github.com/OpenFAT/SpiceRack", rev = "f7fbf3b26806b0e0493412fcee40862a49ccf047", default-features = false, optional = true }

[dev-dependencies]
# The built guest through the real host (tests/guest.rs).
schemify-plugin.workspace = true
# `std` only: no fork/timeout runners (rusty-fork, tempfile) or bit-set strategies used.
proptest = { version = "1", default-features = false, features = ["std"] }

# The plugin is its own workspace; the fuzz crate (`fuzz/`) has its own (cargo-fuzz needs
# nightly flags this one must not see).
[workspace]
resolver = "3"
exclude = ["fuzz"]

# Schemify's public SDK (https://github.com/OpenFAT/Schemify), pinned to one revision.
# `nightly.yml` builds against `main` too, so SDK drift shows up within a day; bump the rev
# here in every entry together. Netlisting, checking and running are the installed `schemify`
# command line's (tests and `maestro-results` call it), never a build dependency.
[workspace.dependencies]
schemify-abi = { git = "https://github.com/OpenFAT/Schemify", rev = "39da966d2ae77d7dbb0325d32c0b80d136f0262e", features = ["guest"] }
schemify-format = { git = "https://github.com/OpenFAT/Schemify", rev = "39da966d2ae77d7dbb0325d32c0b80d136f0262e" }
schemify-plugin = { git = "https://github.com/OpenFAT/Schemify", rev = "39da966d2ae77d7dbb0325d32c0b80d136f0262e" }

# Small module: size over speed, no unwinding (a panic is a trap the host reports).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

