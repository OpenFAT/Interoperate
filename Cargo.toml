[package]
name = "interop"
description = "Interop plugin (D24 as amended 2026-10-12): xschem import today; Virtuoso import/export and xschem export to come. Never linked into the core."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# cdylib: the wasm32 guest. rlib: the same importer as a plain library, for the native CLI
# (`schemify-interop`) and the oracle tests (tests/).
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The native command line (`src/cli.rs`, `schemify-interop`): file system access, so never
# part of the wasm guest.
cli = []

[[bin]]
name = "schemify-interop"
path = "src/bin/schemify-interop.rs"
required-features = ["cli"]

[dependencies]
schemify-abi.workspace = true
schemify-format = { path = "../../crates/format" }
schemify-doc = { path = "../../crates/doc" }
schemify-expr = { path = "../../crates/expr" }

[dev-dependencies]
# The xschem differential (tests/xschem_differential.rs): import → elaborate → netlist →
# compare with xschem's golden netlist through spicecmp, and ngspice results through wave.
schemify-elab = { path = "../../crates/elab" }
schemify-netlist = { path = "../../crates/netlist" }
schemify-spicecmp = { path = "../../tools/spicecmp" }
schemify-wave = { path = "../../crates/wave" }
# The built guest through the real host (tests/guest.rs).
schemify-plugin = { path = "../../crates/plugin" }
# `std` only: no fork/timeout runners (rusty-fork, tempfile) or bit-set strategies used.
proptest = { version = "1", default-features = false, features = ["std"] }
