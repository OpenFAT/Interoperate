[package]
name = "interop"
description = "Interop plugin (D24 as amended 2026-10-12): xschem import today; Virtuoso import/export and xschem export to come. Never linked into the core."
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
publish = false
repository = "https://github.com/OpenFAT/Interoperate"

# cdylib: the wasm32 guest. rlib: the same importer as a plain library, for the native CLI
# (`schemify-interop`) and the oracle tests (tests/).
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The native command line (`src/cli.rs`, `schemify-interop`): file system access, so never
# part of the wasm guest.
cli = []

[[bin]]
name = "schemify-interop"
path = "src/bin/schemify-interop.rs"
required-features = ["cli"]

[dependencies]
schemify-abi.workspace = true
schemify-format.workspace = true
schemify-doc.workspace = true
schemify-expr.workspace = true

[dev-dependencies]
# The xschem differential (tests/xschem_differential.rs): import → elaborate → netlist →
# compare with xschem's golden netlist through spicecmp, and ngspice results through wave.
schemify-elab.workspace = true
schemify-netlist.workspace = true
schemify-spicecmp.workspace = true
schemify-wave.workspace = true
# The built guest through the real host (tests/guest.rs).
schemify-plugin.workspace = true
# `std` only: no fork/timeout runners (rusty-fork, tempfile) or bit-set strategies used.
proptest = { version = "1", default-features = false, features = ["std"] }

# The plugin is its own workspace; the fuzz crate (`fuzz/`) has its own (cargo-fuzz needs
# nightly flags this one must not see).
[workspace]
resolver = "3"
exclude = ["fuzz"]

# Schemify's crates, pinned to one core revision. `nightly.yml` builds against `main` too, so
# core drift shows up within a day; bump the rev here and in every entry together.
[workspace.dependencies]
schemify-abi = { git = "https://github.com/OpenFAT/Schemify", rev = "1752960b3906f9b29765222531b5bfe29e8f6542", features = ["guest"] }
schemify-format = { git = "https://github.com/OpenFAT/Schemify", rev = "1752960b3906f9b29765222531b5bfe29e8f6542" }
schemify-doc = { git = "https://github.com/OpenFAT/Schemify", rev = "1752960b3906f9b29765222531b5bfe29e8f6542" }
schemify-expr = { git = "https://github.com/OpenFAT/Schemify", rev = "1752960b3906f9b29765222531b5bfe29e8f6542" }
schemify-elab = { git = "https://github.com/OpenFAT/Schemify", rev = "1752960b3906f9b29765222531b5bfe29e8f6542" }
schemify-netlist = { git = "https://github.com/OpenFAT/Schemify", rev = "1752960b3906f9b29765222531b5bfe29e8f6542" }
schemify-wave = { git = "https://github.com/OpenFAT/Schemify", rev = "1752960b3906f9b29765222531b5bfe29e8f6542" }
schemify-plugin = { git = "https://github.com/OpenFAT/Schemify", rev = "1752960b3906f9b29765222531b5bfe29e8f6542" }
schemify-spicecmp = { git = "https://github.com/OpenFAT/Schemify", rev = "1752960b3906f9b29765222531b5bfe29e8f6542" }

# Small module: size over speed, no unwinding (a panic is a trap the host reports).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

